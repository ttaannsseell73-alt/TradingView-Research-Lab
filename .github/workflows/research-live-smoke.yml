name: research-live-smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btcusdt-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download public Binance USD-M data
        run: npm run fetch:binance -- BTCUSDT 1m 10000 BTCUSDT-1m.csv
      - name: Run research gate
        run: npm run research -- BTCUSDT-1m.csv 12 | tee research-output.json
      - name: Validate receipt
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('research-output.json','utf8')); if(x.candles!==10000) throw new Error('expected 10000 candles'); if(typeof x.replaySignature!=='string'||x.replaySignature.length!==8) throw new Error('bad signature'); if(!Array.isArray(x.report?.decisions)||x.report.decisions.length!==3) throw new Error('bad decisions'); console.log(JSON.stringify({candles:x.candles,events:x.events,signature:x.replaySignature,decisions:x.report.decisions,validation:x.report.validation,holdout:x.report.holdout},null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: btcusdt-1m-research-receipt
          path: research-output.json
          if-no-files-found: error
          retention-days: 14
