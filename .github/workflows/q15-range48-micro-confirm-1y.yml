name: QUSDT Range48 Micro Confirm 1Y

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  run:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[Q15 RANGE48 MICRO 1Y]')
    runs-on: [self-hosted, datahub-local]
    timeout-minutes: 45
    env:
      DATA_ROOT: C:/Users/TANSEL/Desktop/SCALPING_LAB/freqtrade/user_data/data/binance/futures
      PYTHON_EXE: C:/actions-runner-datahub/.venv-datahub/Scripts/python.exe
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build QUSDT 15m from existing local data only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import polars as pl

          root=Path(r"C:/Users/TANSEL/Desktop/SCALPING_LAB/freqtrade/user_data/data/binance/futures")
          src=root/"Q_USDT_USDT-1m-futures.feather"
          if not src.exists():
              raise SystemExit(f"Missing local Q data: {src}")

          df=pl.read_ipc(src)
          lower={c.lower():c for c in df.columns}
          tc=next((lower[x] for x in ("date","timestamp","time","t") if x in lower),None)
          if not tc:
              raise SystemExit("No time column in local Q feather")

          dtype=df.schema[tc]
          if isinstance(dtype,pl.Datetime):
              texpr=pl.col(tc).dt.epoch("ms")
          elif dtype==pl.Date:
              texpr=pl.col(tc).cast(pl.Datetime("ms")).dt.epoch("ms")
          elif dtype.is_integer():
              texpr=pl.col(tc).cast(pl.Int64)
          else:
              texpr=pl.col(tc).str.to_datetime(strict=False,time_zone="UTC").dt.epoch("ms")

          base=df.select(
              texpr.alias("t"),
              pl.col(lower["open"]).cast(pl.Float64).alias("o"),
              pl.col(lower["high"]).cast(pl.Float64).alias("h"),
              pl.col(lower["low"]).cast(pl.Float64).alias("l"),
              pl.col(lower["close"]).cast(pl.Float64).alias("c"),
              pl.col(lower["volume"]).cast(pl.Float64).alias("v"),
          ).drop_nulls().sort("t")

          if base.height:
              sample=int(base["t"][0])
              if sample < 10_000_000_000:
                  base=base.with_columns((pl.col("t")*1000).alias("t"))
              elif sample > 10_000_000_000_000_000:
                  base=base.with_columns((pl.col("t")//1_000_000).alias("t"))
              elif sample > 10_000_000_000_000:
                  base=base.with_columns((pl.col("t")//1000).alias("t"))

          nominal_start=int(datetime(2025,9,29,tzinfo=timezone.utc).timestamp()*1000)
          nominal_end=int(datetime(2026,9,29,tzinfo=timezone.utc).timestamp()*1000)
          warm_start=nominal_start-7*86400000
          x=base.filter((pl.col("t")>=warm_start)&(pl.col("t")<nominal_end))

          bucket=900_000
          q15=(x.with_columns(((pl.col("t")//bucket)*bucket).alias("_b"))
              .group_by("_b",maintain_order=True)
              .agg(
                  pl.col("o").first().alias("o"),
                  pl.col("h").max().alias("h"),
                  pl.col("l").min().alias("l"),
                  pl.col("c").last().alias("c"),
                  pl.col("v").sum().alias("v"),
                  pl.len().alias("n1m"),
              )
              .filter(pl.col("n1m")==15)
              .drop("n1m")
              .rename({"_b":"t"})
              .sort("t"))

          if q15.height < 1000:
              raise SystemExit(f"Too few Q 15m bars: {q15.height}")

          q15.write_csv("q15-range48-micro-1y.csv")
          meta={
              "source":str(src),
              "rows15m":q15.height,
              "first":datetime.fromtimestamp(int(q15["t"][0])/1000,timezone.utc).isoformat(),
              "last":datetime.fromtimestamp(int(q15["t"][-1])/1000,timezone.utc).isoformat(),
              "nominalStart":"2025-09-29T00:00:00Z",
              "nominalEnd":"2026-09-29T00:00:00Z",
              "noDownload":True,
          }
          Path("q15-range48-micro-meta.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print(json.dumps(meta))
          '@ | Set-Content q15-range48-micro-build.py -Encoding UTF8
          & $env:PYTHON_EXE q15-range48-micro-build.py

      - name: Run Range48 base versus micro-structure confirmations
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import fs from 'node:fs';

          const rows=fs.readFileSync('q15-range48-micro-1y.csv','utf8').trim().split(/\r?\n/);
          const candles=rows.slice(1).map(line=>{
            const [t,o,h,l,c,v]=line.split(',').map(Number);
            return {t,o,h,l,c,v};
          }).filter(b=>[b.t,b.o,b.h,b.l,b.c,b.v].every(Number.isFinite));

          const NOMINAL_START=Date.parse('2025-09-29T00:00:00Z');
          const NOMINAL_END=Date.parse('2026-09-29T00:00:00Z');
          const COST=0.0014;
          const STRESS=0.0015;

          const finite=Number.isFinite;

          function rma(xs,p){
            const out=Array(xs.length).fill(NaN);
            if(xs.length<p)return out;
            let s=0;
            for(let i=0;i<p;i++)s+=xs[i];
            let q=s/p; out[p-1]=q;
            for(let i=p;i<xs.length;i++){q=(q*(p-1)+xs[i])/p;out[i]=q;}
            return out;
          }
          function tr(c){
            return c.map((b,i)=>i?Math.max(b.h-b.l,Math.abs(b.h-c[i-1].c),Math.abs(b.l-c[i-1].c)):b.h-b.l);
          }
          function prevRange(c,p){
            const hi=Array(c.length).fill(NaN),lo=Array(c.length).fill(NaN);
            for(let i=p;i<c.length;i++){
              let h=-Infinity,l=Infinity;
              for(let j=i-p;j<i;j++){h=Math.max(h,c[j].h);l=Math.min(l,c[j].l);}
              hi[i]=h;lo[i]=l;
            }
            return {hi,lo};
          }
          function range48(c){
            const {hi,lo}=prevRange(c,48),atr=rma(tr(c),14),sig=Array(c.length).fill(0);
            for(let i=48;i<c.length;i++){
              const a=atr[i];
              if(!finite(a)||a<=0)continue;
              if(c[i].l<lo[i]-0.05*a&&c[i].c>lo[i])sig[i]=1;
              else if(c[i].h>hi[i]+0.05*a&&c[i].c<hi[i])sig[i]=-1;
            }
            return sig;
          }
          function confirmedPivots(c,left,right){
            const hi=Array(c.length).fill(NaN),lo=Array(c.length).fill(NaN);
            let H=NaN,L=NaN;
            for(let i=0;i<c.length;i++){
              if(i>=left+right){
                const p=i-right;
                let ph=true,pl=true;
                for(let j=p-left;j<=p+right;j++){
                  if(j===p)continue;
                  if(c[j].h>=c[p].h)ph=false;
                  if(c[j].l<=c[p].l)pl=false;
                }
                if(ph)H=c[p].h;
                if(pl)L=c[p].l;
              }
              hi[i]=H;lo[i]=L;
            }
            return {hi,lo};
          }
          function sweepCandleBreak(c,maxWait){
            const raw=range48(c),sig=Array(c.length).fill(0);
            let pending=0,expires=-1,trigger=NaN;
            for(let i=0;i<c.length;i++){
              if(raw[i]===1){pending=1;expires=i+maxWait;trigger=c[i].h;continue;}
              if(raw[i]===-1){pending=-1;expires=i+maxWait;trigger=c[i].l;continue;}
              if(!pending)continue;
              if(i>expires){pending=0;trigger=NaN;continue;}
              if(pending===1&&c[i].c>trigger){sig[i]=1;pending=0;}
              else if(pending===-1&&c[i].c<trigger){sig[i]=-1;pending=0;}
            }
            return sig;
          }
          function pivotBreak(c,left,right,maxWait){
            const raw=range48(c),p=confirmedPivots(c,left,right),sig=Array(c.length).fill(0);
            let pending=0,expires=-1,trigger=NaN;
            for(let i=0;i<c.length;i++){
              if(raw[i]===1){
                pending=1;expires=i+maxWait;trigger=p.hi[i];continue;
              }
              if(raw[i]===-1){
                pending=-1;expires=i+maxWait;trigger=p.lo[i];continue;
              }
              if(!pending)continue;
              if(i>expires||!finite(trigger)){pending=0;trigger=NaN;continue;}
              if(pending===1&&c[i].c>trigger){sig[i]=1;pending=0;}
              else if(pending===-1&&c[i].c<trigger){sig[i]=-1;pending=0;}
            }
            return sig;
          }
          function backtest(c,signals,start){
            const trades=[];
            let pos=0,entryPrice=0,entryTime=0;
            const close=(px,xt)=>{
              if(!pos)return;
              const gross=pos===1?px/entryPrice-1:entryPrice/px-1;
              trades.push({side:pos,entryTime,exitTime:xt,gross});
            };
            for(let i=0;i<signals.length-1;i++){
              const s=signals[i];
              if(!s||s===pos)continue;
              const px=c[i+1].o,tm=c[i+1].t;
              if(tm<start)continue;
              if(pos)close(px,tm);
              pos=s;entryPrice=px;entryTime=tm;
            }
            if(pos&&c.length)close(c.at(-1).c,c.at(-1).t);
            return trades;
          }
          function stats(trades,cost){
            const rs=trades.map(t=>t.gross-cost);
            let eq=1,peak=1,dd=0,wins=0,gw=0,gl=0;
            for(const r of rs){
              if(r>0){wins++;gw+=r;} else if(r<0)gl+=r;
              eq*=Math.max(1e-9,1+r);
              peak=Math.max(peak,eq);
              dd=Math.max(dd,1-eq/peak);
            }
            return {
              n:rs.length,
              wr:rs.length?wins/rs.length:0,
              net:eq-1,
              pf:gl<0?gw/Math.abs(gl):(gw>0?999:0),
              dd,
              exp:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0,
            };
          }
          function monthStats(trades,cost){
            const g=new Map();
            for(const t of trades){
              const m=new Date(t.entryTime).toISOString().slice(0,7);
              if(!g.has(m))g.set(m,[]);
              g.get(m).push(t);
            }
            return [...g].map(([month,ts])=>({month,...stats(ts,cost)})).sort((a,b)=>a.month.localeCompare(b.month));
          }
          function summarize(id,name,signal){
            const trades=backtest(candles,signal,NOMINAL_START);
            const overall=stats(trades,COST);
            const stress=stats(trades,STRESS);
            const long=stats(trades.filter(t=>t.side===1),COST);
            const short=stats(trades.filter(t=>t.side===-1),COST);
            const months=monthStats(trades,COST);
            return {
              id,name,overall,stress,long,short,months,
              positiveMonths:months.filter(x=>x.net>0).length,
              monthsTested:months.length,
              worstMonth:months.length?months.reduce((a,b)=>a.net<b.net?a:b):null,
              bestMonth:months.length?months.reduce((a,b)=>a.net>b.net?a:b):null,
            };
          }

          const variants=[
            summarize('BASE','Range48 base',range48(candles)),
            summarize('MSS_W3','Range48 + sweep-candle high/low break (<=3 bar)',sweepCandleBreak(candles,3)),
            summarize('PIV22_W8','Range48 + latest confirmed pivot 2/2 break (<=8 bar)',pivotBreak(candles,2,2,8)),
            summarize('PIV22_W12','Range48 + latest confirmed pivot 2/2 break (<=12 bar)',pivotBreak(candles,2,2,12)),
            summarize('PIV33_W12','Range48 + latest confirmed pivot 3/3 break (<=12 bar)',pivotBreak(candles,3,3,12)),
          ];

          const base=variants[0];
          for(const v of variants){
            v.deltaVsBase={
              net:v.overall.net-base.overall.net,
              dd:v.overall.dd-base.overall.dd,
              pf:v.overall.pf-base.overall.pf,
              trades:v.overall.n-base.overall.n,
              longNet:v.long.net-base.long.net,
              shortNet:v.short.net-base.short.net,
            };
          }

          const actualFirst=candles.length?new Date(candles[0].t).toISOString():null;
          const actualLast=candles.length?new Date(candles.at(-1).t).toISOString():null;
          const result={
            symbol:'QUSDT',
            timeframe:'15m',
            nominalWindow:{start:new Date(NOMINAL_START).toISOString(),end:new Date(NOMINAL_END).toISOString()},
            actualCoverage:{first:actualFirst,last:actualLast,bars:candles.length},
            execution:'closed signal -> next-bar-open; REVERSAL; x1 research',
            costs:{baseRoundTrip:COST,stressRoundTrip:STRESS},
            variants,
          };

          fs.mkdirSync('artifacts/q15-range48-micro-1y',{recursive:true});
          fs.writeFileSync('artifacts/q15-range48-micro-1y/result.json',JSON.stringify(result,null,2)+'\n');

          const pct=x=>(x*100).toFixed(2)+'%';
          const lines=[
            '# QUSDT 15m — Range48 Micro Confirmation 1Y',
            '',
            'Coverage: '+actualFirst+' -> '+actualLast+' | bars '+candles.length,
            'Execution: closed signal -> next-bar-open | cost 14 bps | stress 15 bps',
            '',
          ];
          for(const v of variants){
            lines.push('## '+v.id+' — '+v.name);
            lines.push('Net **'+pct(v.overall.net)+'** | PF **'+v.overall.pf.toFixed(2)+'** | WR '+pct(v.overall.wr)+' | DD '+pct(v.overall.dd)+' | trades '+v.overall.n+' | stress '+pct(v.stress.net));
            lines.push('LONG: '+pct(v.long.net)+' | PF '+v.long.pf.toFixed(2)+' | trades '+v.long.n+' | SHORT: '+pct(v.short.net)+' | PF '+v.short.pf.toFixed(2)+' | trades '+v.short.n);
            lines.push('Positive months: '+v.positiveMonths+'/'+v.monthsTested+(v.worstMonth?' | worst '+v.worstMonth.month+' '+pct(v.worstMonth.net):'')+(v.bestMonth?' | best '+v.bestMonth.month+' '+pct(v.bestMonth.net):''));
            lines.push('Delta vs BASE: net '+pct(v.deltaVsBase.net)+' | DD '+pct(v.deltaVsBase.dd)+' | trades '+v.deltaVsBase.trades);
            lines.push('');
          }
          fs.writeFileSync('artifacts/q15-range48-micro-1y/summary.md',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          '@ | Set-Content q15-range48-micro-run.mjs -Encoding UTF8
          node q15-range48-micro-run.mjs

      - name: Publish result to issue
        if: always()
        shell: powershell
        run: |
          $p="artifacts/q15-range48-micro-1y/summary.md"
          if(Test-Path $p){
            gh issue comment $env:ISSUE_NUMBER --repo $env:REPO --body-file $p
          }

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q15-range48-micro-1y-${{ github.run_id }}
          path: |
            artifacts/q15-range48-micro-1y/result.json
            artifacts/q15-range48-micro-1y/summary.md
            q15-range48-micro-meta.json
          if-no-files-found: warn
          retention-days: 14
