name: SR25 2026 Full Local

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  run:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[SR25 2026 FULL RUN]')
    runs-on: [self-hosted, datahub-local]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PROGRESS_ISSUE_NUMBER: ${{ github.event.issue.number }}
      FREQTRADE_FUTURES_ROOT: C:/Users/TANSEL/Desktop/SCALPING_LAB/freqtrade/user_data/data/binance/futures
      LOCAL_DATA_MODE: strict
      RESEARCH_BACKEND: local
      RESEARCH_OUT_DIR: artifacts/sr25-2026-full
      DATAHUB_PYTHON: C:/actions-runner-datahub/.venv-datahub/Scripts/python.exe
      SHARD_INDEX: 0
      SHARD_COUNT: 1
      REUSE_EXISTING_CSV: 1
      BATCH_LOCAL_CACHE: 1
      LOCAL_PARALLEL_SHARDS: 4
      RESEARCH_CSV_DIR: D:/Futures-Research-Data/research-cache/2026-01-01__2026-09-20__1m-5m-15m-1h-4h
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build exact 725-symbol plan from stable 15m universe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $suffix = "_USDT_USDT-15m-futures.feather"
          $files = Get-ChildItem "$env:FREQTRADE_FUTURES_ROOT\*-15m-futures.feather" -File | Sort-Object Name
          $symbols = @()
          foreach ($f in $files) {
            if ($f.Name.EndsWith($suffix)) {
              $base = $f.Name.Substring(0, $f.Name.Length - $suffix.Length)
              $symbols += (($base -replace "_","") + "USDT")
            }
          }
          $symbols = @($symbols | Sort-Object -Unique)
          if ($symbols.Count -ne 725) { throw "Expected exact original universe of 725 symbols, found $($symbols.Count)." }

          $plan = [ordered]@{
            backend = "local"
            cloudShards = 1
            symbols = $symbols
            timeframes = @("1m","5m","15m","1h","4h")
            start = "2026-01-01T00:00:00Z"
            end = "2026-09-20T00:00:00Z"
            strategies = @(
              "sr25_fractal_cluster_rejection",
              "sr25_confirmed_pivot_breakout",
              "sr25_breakout_retest",
              "sr25_role_reversal_flip",
              "sr25_wick_confirmed_zone",
              "sr25_liquidity_sweep_reclaim",
              "sr25_liquidity_absorption",
              "sr25_previous_day_sweep",
              "sr25_week_month_sweep",
              "sr25_lsob",
              "sr25_impulse_ob_retest",
              "sr25_fvg_first_touch",
              "sr25_inverse_fvg",
              "sr25_pdh_fvg_mss",
              "sr25_supply_demand_retest",
              "sr25_kernel_supply_demand",
              "sr25_camarilla_h3_l3",
              "sr25_camarilla_h4_l4",
              "sr25_narrow_cpr_breakout",
              "sr25_poc_mean_reversion",
              "sr25_value_area_80",
              "sr25_naked_poc_revisit",
              "sr25_swing_anchored_vwap",
              "sr25_trendline_breakout",
              "sr25_donchian_breakout"
            )
            minCoverage = 0.98
            minTrades = @{ "1m"=50; "5m"=30; "15m"=25; "1h"=20; "4h"=10 }
            monthlyBreakdown = $true
            monthlyMinTrades = 10
            cost = 0.0014
            stressCost = 0.0015
            lowCost = 0.0006
            maxErrorRate = 0.10
          }
          $json = $plan | ConvertTo-Json -Depth 8 -Compress
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "plan.json"), $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "SYMBOLS=$($symbols.Count) TASKS=$($symbols.Count * 5)"

      - name: Run SR25 2026 full universe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/run-datahub-plan-parallel-local.mjs plan.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr25-2026-full-result
          path: |
            artifacts/sr25-2026-full/summary-*.json
            artifacts/sr25-2026-full/top-*.csv
            artifacts/sr25-2026-full/results-*.ndjson
            artifacts/sr25-2026-full/monthly-*.ndjson
            artifacts/sr25-2026-full/failures-*.ndjson
          if-no-files-found: warn
