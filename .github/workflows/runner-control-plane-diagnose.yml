name: GitHub Actions Control Plane Diagnose

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/runner-control-plane-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Actions control plane
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "ACTIONS_CONTROL_PLANE_OK"
          gh api "repos/$REPO/actions/runs?per_page=5" --jq '.workflow_runs[] | {id,name,status,conclusion,event,created_at}'
          echo "Self-hosted runner health is verified separately by runner-selfhosted-smoke.yml."
