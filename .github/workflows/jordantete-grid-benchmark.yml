name: jordantete-grid-benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/jordantete-grid-benchmark.yml'
      - 'research/upstream-grid/JORDANTETE_BENCHMARK.md'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout research lab
        uses: actions/checkout@v4

      - name: Checkout grid_trading_bot
        uses: actions/checkout@v4
        with:
          repository: jordantete/grid_trading_bot
          ref: master
          path: upstream/grid_trading_bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: upstream/grid_trading_bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build offline benchmark datasets and configs
        working-directory: upstream/grid_trading_bot
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile
          from pathlib import Path
          import pandas as pd

          data_dir = Path("benchmark_data")
          cfg_dir = Path("benchmark_configs")
          out_dir = Path("benchmark_results")
          for d in (data_dir, cfg_dir, out_dir):
              d.mkdir(parents=True, exist_ok=True)

          for coin in ("BTC", "ETH", "SOL"):
              symbol = f"{coin}USDT"
              url = f"https://data.binance.vision/data/futures/um/monthly/klines/{symbol}/1m/{symbol}-1m-2026-08.zip"
              print("Downloading", url)
              with urllib.request.urlopen(url, timeout=90) as resp:
                  raw = resp.read()
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  name = next(n for n in zf.namelist() if n.endswith(".csv"))
                  rows = list(csv.reader(io.StringIO(zf.read(name).decode("utf-8"))))

              parsed = []
              for row in rows:
                  if not row:
                      continue
                  try:
                      ts = int(row[0])
                  except ValueError:
                      continue
                  if ts > 10_000_000_000_000:
                      ts //= 1000
                  parsed.append([ts, *map(float, row[1:6])])

              df = pd.DataFrame(parsed, columns=["timestamp","open","high","low","close","volume"])
              df["timestamp"] = pd.to_datetime(df["timestamp"], unit="ms", utc=True).dt.tz_localize(None)
              train = df[(df["timestamp"] >= "2026-08-01") & (df["timestamp"] < "2026-08-08")]
              test = df[(df["timestamp"] >= "2026-08-08") & (df["timestamp"] <= "2026-08-31 23:59:00")]
              if len(train) < 9000 or len(test) < 30000:
                  raise SystemExit(f"Insufficient data for {coin}: train={len(train)} test={len(test)}")

              bottom = float(train["low"].quantile(0.02)) * 0.995
              top = float(train["high"].quantile(0.98)) * 1.005
              if not top > bottom:
                  raise SystemExit(f"Invalid grid range for {coin}")

              csv_path = data_dir / f"{symbol}_2026-08.csv"
              df.to_csv(csv_path, index=False)

              cfg = {
                "exchange": {
                  "name": "binance",
                  "trading_fee": 0.0004,
                  "trading_mode": "backtest"
                },
                "pair": {
                  "base_currency": coin,
                  "quote_currency": "USDT"
                },
                "trading_settings": {
                  "timeframe": "1m",
                  "period": {
                    "start_date": "2026-08-08T00:00:00Z",
                    "end_date": "2026-08-31T23:59:00Z"
                  },
                  "initial_balance": 10000,
                  "historical_data_file": str(csv_path)
                },
                "grid_strategy": {
                  "type": "hedged_grid",
                  "spacing": "geometric",
                  "num_grids": 8,
                  "range": {"top": top, "bottom": bottom},
                  "buy_ratio": 1.0,
                  "sell_ratio": 1.0
                },
                "risk_management": {
                  "take_profit": {"enabled": False, "threshold": 0},
                  "stop_loss": {"enabled": False, "threshold": 0}
                },
                "execution": {
                  "backtest_slippage": 0.0005,
                  "reconciliation_interval": 300.0,
                  "reconciliation_balance_tolerance": 0.01
                },
                "logging": {"log_level": "INFO", "log_to_file": False}
              }
              (cfg_dir / f"{coin}.json").write_text(json.dumps(cfg, indent=2))
              print(coin, "range", bottom, top, "train", len(train), "test", len(test))
          PY

      - name: Run BTC ETH SOL backtests
        working-directory: upstream/grid_trading_bot
        shell: bash
        run: |
          set -euo pipefail
          for coin in BTC ETH SOL; do
            grid_trading_bot run \
              --config "benchmark_configs/$coin.json" \
              --save_performance_results "benchmark_results/$coin.json" \
              --no-plot
          done

      - name: Normalize summary
        working-directory: upstream/grid_trading_bot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = {
            "engine": "jordantete/grid_trading_bot",
            "revision": "master",
            "exchange": "binance",
            "market_data": "Binance USD-M futures 1m OHLCV",
            "training_window_for_grid_range": ["2026-08-01", "2026-08-07"],
            "evaluation_window": ["2026-08-08", "2026-08-31"],
            "costs": {"trading_fee": 0.0004, "backtest_slippage": 0.0005},
            "symbols": {}
          }
          for coin in ("BTC","ETH","SOL"):
              data = json.loads(Path(f"benchmark_results/{coin}.json").read_text())
              if not data:
                  raise SystemExit(f"No performance result for {coin}")
              item = data[-1]
              out["symbols"][coin] = {
                "performance_summary": item.get("performance_summary", {}),
                "order_count": len(item.get("orders", [])),
                "grid": item.get("config", {}).get("grid_strategy", {})
              }
          Path("benchmark_results/JORDANTETE_SUMMARY.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jordantete-grid-benchmark-${{ github.run_id }}
          path: |
            upstream/grid_trading_bot/benchmark_results
            upstream/grid_trading_bot/benchmark_configs
          if-no-files-found: error
          retention-days: 14
