name: LiveBot Local Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[LIVEBOT AUDIT]')
    runs-on: [self-hosted, datahub-local]
    timeout-minutes: 15
    env:
      BOT_ROOT: C:/Users/TANSEL/Desktop/binance-bot
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Audit local canonical bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:BOT_ROOT
          if (!(Test-Path $root)) { throw "BOT_ROOT missing: $root" }
          $out = Join-Path $env:RUNNER_TEMP "livebot-audit.md"
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("# Local binance-bot audit")
          $lines.Add("")
          $lines.Add("Root: $root")
          $lines.Add("")
          $lines.Add("## Git")
          Push-Location $root
          try {
            $branch = (git branch --show-current 2>$null)
            $head = (git rev-parse HEAD 2>$null)
            $status = (git status --short 2>$null | Select-Object -First 60) -join [Environment]::NewLine
            $lines.Add("Branch: $branch")
            $lines.Add("HEAD: $head")
            $lines.Add($status)
          } catch {
            $lines.Add("Git metadata unavailable: $($_.Exception.Message)")
          }
          $lines.Add("")
          $lines.Add("## Top-level")
          $top = Get-ChildItem -Force | Sort-Object Name | Select-Object Name,Mode,Length
          $lines.Add(($top | Format-Table -AutoSize | Out-String))
          foreach ($f in @("package.json","tsconfig.json","vitest.config.ts","vitest.config.js","README.md")) {
            $p = Join-Path $root $f
            if (Test-Path $p) {
              $lines.Add("")
              $lines.Add("## $f")
              $txt = Get-Content $p -Raw
              if ($txt.Length -gt 12000) { $txt = $txt.Substring(0,12000) + [Environment]::NewLine + "...truncated" }
              $lines.Add($txt)
            }
          }
          $lines.Add("")
          $lines.Add("## Source/Test inventory")
          $files = Get-ChildItem $root -Recurse -File | Where-Object {
              $_.FullName -notmatch "\\node_modules\\" -and
              $_.FullName -notmatch "\\.git\\" -and
              $_.Extension -in ".ts",".tsx",".js",".mjs",".json",".md"
            } | Sort-Object FullName | Select-Object -First 250 | ForEach-Object { $_.FullName.Substring($root.Length+1) }
          $lines.Add(($files -join [Environment]::NewLine))
          [IO.File]::WriteAllLines($out,$lines,[Text.UTF8Encoding]::new($false))
          Pop-Location
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPO --body-file $out
