name: Near-Pass 2Y Baseline

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.author_association == 'OWNER' &&
        startsWith(github.event.issue.title, '[NEARPASS 2Y]')
      )
    runs-on: [self-hosted, datahub-local]
    timeout-minutes: 180
    env:
      FREQTRADE_FUTURES_ROOT: C:/Users/TANSEL/Desktop/SCALPING_LAB/freqtrade/user_data/data/binance/futures
      DATAHUB_PYTHON: C:/actions-runner-datahub/.venv-datahub/Scripts/python.exe
      DATAHUB_ROOT: C:/actions-runner-datahub/nearpass-2y-datahub
      RESEARCH_CSV_DIR: C:/actions-runner-datahub/nearpass-2y-cache/2024-09-28__2026-09-28__1m-5m-15m-1h-4h
      RESEARCH_OUT_DIR: artifacts/nearpass-2y-baseline
      LOCAL_PARALLEL_SHARDS: 4
      LOCAL_DATA_MODE: strict

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build lifetime-aware 2Y seed plan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $seed = Get-Content research/nearpass-8of9-seeds.json -Raw | ConvertFrom-Json
          $symbols = @($seed.seeds | ForEach-Object { $_.symbol } | Sort-Object -Unique)
          $timeframes = @($seed.seeds | ForEach-Object { $_.timeframe } | Sort-Object -Unique)
          $strategies = @($seed.seeds | ForEach-Object { $_.strategyId } | Sort-Object -Unique)

          if ($seed.seeds.Count -ne 33) { throw "Expected 33 canonical near-pass seeds." }

          $plan = [ordered]@{
            backend = "local"
            symbols = $symbols
            timeframes = $timeframes
            start = "2024-09-28T00:00:00Z"
            end = "2026-09-28T00:00:00Z"
            strategies = $strategies
            lifetimeAware = $true
            minCoverage = 0.98
            minHistoryDays = 30
            minTrades = @{ "1m"=50; "5m"=30; "15m"=25; "1h"=20; "4h"=10 }
            monthlyBreakdown = $true
            monthlyMinTrades = 10
            cost = 0.0014
            stressCost = 0.0015
            lowCost = 0.0006
          }
          $json = $plan | ConvertTo-Json -Depth 8 -Compress
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "nearpass-2y-plan.json"), $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "NEARPASS seeds=$($seed.seeds.Count) symbols=$($symbols.Count) timeframes=$($timeframes.Count) strategies=$($strategies.Count)"

      - name: Verify local data bridge
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          if (-not (Test-Path $env:DATAHUB_PYTHON)) { throw "DATAHUB_PYTHON missing: $env:DATAHUB_PYTHON" }
          & $env:DATAHUB_PYTHON --version
          New-Item -ItemType Directory -Force -Path $env:DATAHUB_ROOT | Out-Null
          New-Item -ItemType Directory -Force -Path $env:RESEARCH_CSV_DIR | Out-Null

      - name: Run 2Y lifetime-aware baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/run-datahub-plan-parallel-local.mjs nearpass-2y-plan.json
          if ($LASTEXITCODE -ne 0) { throw "Near-pass 2Y baseline runner failed." }

      - name: Extract exact 33 seeds
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/summarize-nearpass-2y.mjs "$env:RESEARCH_OUT_DIR" research/nearpass-8of9-seeds.json
          if ($LASTEXITCODE -ne 0) { throw "Near-pass 2Y summary failed." }

      - name: Publish issue summary
        if: github.event_name == 'issues'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $j = Get-Content "$env:RESEARCH_OUT_DIR\nearpass-2y-seed-baseline.json" -Raw | ConvertFrom-Json
          $c = $j.counts
          $body = @"
          Near-Pass 2Y baseline tamamlandı.

          - seed: **$($j.sourceSeedCount)**
          - full history: **$($c.fullHistory)**
          - shorter listing history: **$($c.shorterListingHistory)**
          - young coin: **$($c.youngCoin)**
          - short history (FAIL değil): **$($c.shortHistory)**
          - data gap (FAIL değil): **$($c.dataGap)**
          - gerçek error: **$($c.error)**
          - all-month pass: **$($c.allMonthsPass)**
          - one-month-short: **$($c.oneMonthShort)**
          - >=80% monthly consistency: **$($c.ge80pct)**

          Yeni/listelenme tarihi kısa coinler ilk mevcut bardan itibaren lifetime-aware değerlendirildi; sırf 2 yıllık geçmişi yok diye FAIL verilmedi.
          "@
          gh issue comment "${{ github.event.issue.number }}" --body $body

      - name: Upload 2Y baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nearpass-2y-baseline-${{ github.run_id }}
          path: |
            artifacts/nearpass-2y-baseline/nearpass-2y-seed-baseline.json
            artifacts/nearpass-2y-baseline/nearpass-2y-seed-baseline.csv
            artifacts/nearpass-2y-baseline/summary-*.json
            artifacts/nearpass-2y-baseline/failures-*.ndjson
          if-no-files-found: warn
          retention-days: 30
