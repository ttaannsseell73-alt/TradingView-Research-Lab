# exchange-audit-retry 1790788384733
# live status refresh 1790779533641
# probe refresh: verify current Demo-11 TESTNET runtime after installer failure
name: Demo-11 Runtime Probe

on:
  push:
    branches: [ demo11-canonical-rebuild ]
    paths:
      - '.github/workflows/demo11-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo11-runtime-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, datahub-local]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read Demo-11 local runtime without exchange writes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root="C:\Users\TANSEL\Desktop\Demo11-Shadow"
          Write-Host "PROBE_AT=$(Get-Date -Format o)"
          Write-Host "=== PROCESSES ==="
          Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and ($_.CommandLine -match 'run-demo11-local-loop\.ps1' -or $_.CommandLine -match 'run-demo11-testnet-loop\.ps1')
          } | Select-Object ProcessId,Name,CreationDate,CommandLine | Format-List

          foreach($rel in @(
            "artifacts\demo11\DEMO11_LOCAL_STATUS.json",
            "artifacts\demo11\DEMO11_TESTNET_STATUS.json",
            "artifacts\demo11\canonical-shadow\DEMO11_CANONICAL_SHADOW.json",
            "artifacts\demo11\testnet-bridge\DEMO11_TESTNET_SIGNAL.json"
          )){
            $p=Join-Path $root $rel
            Write-Host "=== FILE $rel ==="
            if(Test-Path $p){
              $f=Get-Item $p
              Write-Host "LAST_WRITE=$($f.LastWriteTime.ToString('o')) SIZE=$($f.Length)"
              Get-Content $p -Raw
            } else {
              Write-Host "MISSING"
            }
          }

          Write-Host "=== DEMO11 FILL LEDGER AUDIT ==="
          $pg="canonical-demo11-testnet-pg"
          $running = docker ps --filter "name=^/$pg$" --format "{{.Names}}"
          if($running){
            docker exec $pg psql -U postgres -d demo11_testnet -P pager=off -c "SELECT COUNT(*) AS total_fills, COUNT(*) FILTER (WHERE event_time >= 1790726400000) AS metric_fills FROM live_fills;"
            docker exec $pg psql -U postgres -d demo11_testnet -P pager=off -c "SELECT symbol, side, COUNT(*) AS fills, ROUND(SUM(quantity)::numeric,8) AS qty, MIN(event_time) AS first_ms, MAX(event_time) AS last_ms FROM live_fills WHERE event_time >= 1790726400000 GROUP BY symbol,side ORDER BY symbol,side;"
            docker exec $pg psql -U postgres -d demo11_testnet -P pager=off -c "SELECT symbol,side,fill_price,quantity,event_time,fill_id,intent_id FROM live_fills WHERE event_time >= 1790726400000 ORDER BY event_time,fill_id LIMIT 200;"
            docker exec $pg psql -U postgres -d demo11_testnet -P pager=off -c "SELECT event_type,COUNT(*) AS n FROM live_events WHERE created_at >= TIMESTAMPTZ '2026-09-30 00:00:00+00' GROUP BY event_type ORDER BY event_type;"
          } else {
            Write-Host "DEMO11_PG_NOT_RUNNING"
          }

          Write-Host "=== DEMO11 EXCHANGE AUDIT ==="
          $bot="C:\Users\TANSEL\Desktop\binance-bot"
          Copy-Item "$env:GITHUB_WORKSPACE\livebot-patch\src\tools\auditDemo11Exchange.ts" "$bot\src\tools\auditDemo11Exchange.ts" -Force
          Push-Location $bot
          try {
            npx tsx src/tools/auditDemo11Exchange.ts
            if($LASTEXITCODE -ne 0){ throw "DEMO11_EXCHANGE_AUDIT_FAILED" }
          } finally {
            Pop-Location
          }
