name: Near-Pass Variant Sweep

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.author_association == 'OWNER' &&
        startsWith(github.event.issue.title, '[NEARPASS VARIANT]')
      )
    runs-on: [self-hosted, datahub-local]
    timeout-minutes: 180
    env:
      FREQTRADE_FUTURES_ROOT: C:/Users/TANSEL/Desktop/SCALPING_LAB/freqtrade/user_data/data/binance/futures
      DATAHUB_PYTHON: C:/actions-runner-datahub/.venv-datahub/Scripts/python.exe
      DATAHUB_ROOT: C:/actions-runner-datahub/nearpass-variant-datahub
      RESEARCH_CSV_DIR: C:/actions-runner-datahub/nearpass-2y-cache/2024-09-28__2026-09-28__1m-5m-15m
      RESEARCH_OUT_DIR: artifacts/nearpass-variant-sweep
      LOCAL_PARALLEL_SHARDS: 4
      LOCAL_DATA_MODE: strict

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build focused variant plan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $plan = [ordered]@{
            backend = "local"
            symbols = @("QUSDT","HANAUSDT","FFUSDT","ALLOUSDT")
            timeframes = @("1m","5m","15m")
            start = "2024-09-28T00:00:00Z"
            end = "2026-09-28T00:00:00Z"
            strategies = @(
              "sr_range_edge",
              "sr_prior_day_sweep",
              "sr25_liquidity_absorption",
              "sr25_value_area_80",
              "sr25_poc_mean_reversion",
              "sr25_impulse_ob_retest",
              "sr25_liquidity_sweep_reclaim",
              "sr25_previous_day_sweep",
              "sr25_lsob",
              "sr25_fvg_first_touch",
              "sr25_inverse_fvg",
              "sr25_supply_demand_retest",
              "sr25_naked_poc_revisit",
              "sr25_swing_anchored_vwap",
              "swp_range12_reclaim",
              "swp_range24_reclaim",
              "swp_range48_reclaim",
              "swp_range96_reclaim",
              "swp_prior_day",
              "swp_pivot_sfp_body",
              "swp_volume_absorption",
              "swp_atr_expansion",
              "swp_ema50_filter",
              "swp_rsi_exhaustion",
              "swp_wick_sfp",
              "swp_compression_reclaim",
              "swp_mss_confirm",
              "swp_failed_breakout"
            )
            lifetimeAware = $true
            minCoverage = 0.98
            minHistoryDays = 30
            minTrades = @{ "1m"=50; "5m"=30; "15m"=25 }
            monthlyBreakdown = $true
            monthlyMinTrades = 10
            cost = 0.0014
            stressCost = 0.0015
            lowCost = 0.0006
          }
          $plan | ConvertTo-Json -Depth 10 -Compress | Set-Content -Encoding utf8 nearpass-variant-plan.json
          Write-Host "Focused sweep: 4 symbols x 3 TF x 28 strategies = 336 combinations"

      - name: Run focused 2Y variant sweep
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/run-datahub-plan-parallel-local.mjs nearpass-variant-plan.json
          if ($LASTEXITCODE -ne 0) { throw "Focused variant sweep failed." }

      - name: Publish compact issue summary
        if: github.event_name == 'issues'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem "$env:RESEARCH_OUT_DIR\summary-local-*.json"
          $completed = 0
          $combos = 0
          $passing = 0
          $hard = 0
          foreach ($f in $files) {
            $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
            $completed += [int]$j.completedTasks
            $combos += [int]$j.combinations
            $passing += [int]$j.passing
            $hard += [int]$j.hardFailures
          }
          $body = @"
          Focused Near-Pass variant sweep tamamlandı.

          - görev: **$completed**
          - kombinasyon: **$combos**
          - genel PASS: **$passing**
          - hard failure: **$hard**
          - kapsam: Q / HANA / FF / ALLO · 1m/5m/15m · 28 yakın varyant
          - LONG/SHORT metrikleri raw result artifactında ayrı tutuldu.
          "@
          gh issue comment "${{ github.event.issue.number }}" --body $body

      - name: Upload focused sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nearpass-variant-sweep-${{ github.run_id }}
          path: |
            artifacts/nearpass-variant-sweep/summary-*.json
            artifacts/nearpass-variant-sweep/results-*.ndjson
            artifacts/nearpass-variant-sweep/monthly-*.ndjson
            artifacts/nearpass-variant-sweep/failures-*.ndjson
            artifacts/nearpass-variant-sweep/top-*.csv
          if-no-files-found: warn
          retention-days: 30
