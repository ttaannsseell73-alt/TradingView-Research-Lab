name: Cancel Requested Run

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  cancel:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[CANCEL RUN] ')
    runs-on: ubuntu-latest
    steps:
      - name: Cancel run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="${TITLE#'[CANCEL RUN] '}"
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid run id: $RUN_ID"
            exit 1
          fi
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel"
          echo "CANCEL_REQUESTED run=$RUN_ID"
