name: Local Freqtrade Help

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[LOCAL FREQTRADE HELP]')
    runs-on: [self-hosted, datahub-local]
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FT_ROOT: C:/Users/TANSEL/Desktop/SCALPING_LAB/freqtrade
    steps:
      - name: Read local Freqtrade CLI help
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:FT_ROOT
          $o = New-Object System.Collections.Generic.List[string]
          $o.Add("SERVICES:")
          $svc = docker compose config --services 2>&1
          foreach ($x in $svc) { $o.Add([string]$x) }
          $o.Add("")
          $o.Add("DOWNLOAD_DATA_HELP:")
          $help = docker compose run --rm freqtrade download-data --help 2>&1
          foreach ($x in $help) { $o.Add([string]$x) }
          $tmp = Join-Path $env:RUNNER_TEMP "freqtrade-help.txt"
          $o | Set-Content -LiteralPath $tmp -Encoding UTF8
          Get-Content -LiteralPath $tmp
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPO --body-file $tmp
