name: Hybrid DataHub Research

on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: JSON research plan
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.author_association == 'OWNER' &&
       startsWith(github.event.issue.title, '[DATAHUB JOB]'))
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      plan_b64: ${{ steps.plan.outputs.plan_b64 }}
      cloud_matrix: ${{ steps.plan.outputs.cloud_matrix }}
      total_shards: ${{ steps.plan.outputs.total_shards }}
      local_index: ${{ steps.plan.outputs.local_index }}
      total_tasks: ${{ steps.plan.outputs.total_tasks }}
    steps:
      - name: Validate and encode plan
        id: plan
        env:
          DISPATCH_PLAN: ${{ inputs.plan_json }}
          ISSUE_PLAN: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          raw = (os.environ.get("DISPATCH_PLAN") or os.environ.get("ISSUE_PLAN") or "").strip()
          plan = json.loads(raw)
          backend = plan.get("backend")
          if backend not in {"cloud", "local", "hybrid"}:
              raise SystemExit("backend must be cloud|local|hybrid")

          symbols = sorted(set(plan.get("symbols") or []))
          timeframes = sorted(set(plan.get("timeframes") or []))
          if not symbols or not timeframes:
              raise SystemExit("symbols and timeframes must be nonempty arrays")
          tasks = len(symbols) * len(timeframes)

          default_cloud = 4 if backend == "cloud" else 2 if backend == "hybrid" else 1
          requested_cloud = plan.get("cloudShards", default_cloud)
          if not isinstance(requested_cloud, int) or not 1 <= requested_cloud <= 8:
              raise SystemExit("cloudShards must be an integer from 1 to 8")

          if backend == "cloud":
              cloud_count = min(requested_cloud, tasks)
              total_shards = cloud_count
              local_index = 0
          elif backend == "hybrid":
              cloud_count = min(requested_cloud, max(1, tasks - 1))
              total_shards = cloud_count + 1
              local_index = cloud_count
          else:
              cloud_count = 1
              total_shards = 1
              local_index = 0

          encoded = base64.b64encode(raw.encode()).decode()
          cloud_matrix = json.dumps(list(range(cloud_count)), separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"backend={backend}\n")
              fh.write(f"plan_b64={encoded}\n")
              fh.write(f"cloud_matrix={cloud_matrix}\n")
              fh.write(f"total_shards={total_shards}\n")
              fh.write(f"local_index={local_index}\n")
              fh.write(f"total_tasks={tasks}\n")
          PY

  progress:
    needs: prepare
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ github.run_id }}
      TOTAL_SHARDS: ${{ needs.prepare.outputs.total_shards }}
      TOTAL_TASKS: ${{ needs.prepare.outputs.total_tasks }}
    steps:
      - name: Live progress bar
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- DATAHUB_LIVE_PROGRESS -->'

          comment_id="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[] | select(.body | contains("DATAHUB_LIVE_PROGRESS")) | .id' | head -n 1 || true)"
          if [ -z "$comment_id" ]; then
            comment_id="$(gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$marker
          **Canlı ilerleme**
          **░░░░░░░░░░░░░░░░░░░░ 0%**
          Hazırlanıyor…" --jq '.id')"
          fi

          update_comment() {
            local pct="$1"
            local state="$2"
            local done_count="$3"
            local running_count="$4"
            local failed_count="$5"
            local processed_tasks="$6"
            local filled=$(( pct / 5 ))
            local empty=$(( 20 - filled ))
            local bar=""
            local i
            for ((i=0;i<filled;i++)); do bar="${bar}█"; done
            for ((i=0;i<empty;i++)); do bar="${bar}░"; done
            local body
            body="$marker
          **Canlı ilerleme**
          **${bar} ${pct}%**

          Coin: **${processed_tasks}/${TOTAL_TASKS} işlendi** · Shard: **${done_count}/${TOTAL_SHARDS} tamamlandı**
          Çalışan: **${running_count}** · Hatalı: **${failed_count}**
          Durum: **${state}**

          [Workflow'u aç](https://github.com/$REPO/actions/runs/$RUN_ID)

          _Yaklaşık 15 saniyede bir otomatik güncellenir._"
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" >/dev/null
          }

          while true; do
            jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            done_count="$(jq '[.jobs[] | select((.name | startswith("cloud")) or .name=="local") | select(.conclusion != null and .conclusion != "skipped")] | length' <<<"$jobs")"
            running_count="$(jq '[.jobs[] | select((.name | startswith("cloud")) or .name=="local") | select(.status=="in_progress")] | length' <<<"$jobs")"
            failed_count="$(jq '[.jobs[] | select((.name | startswith("cloud")) or .name=="local") | select(.conclusion=="failure")] | length' <<<"$jobs")"
            merge_status="$(jq -r '[.jobs[] | select(.name=="merge")][0].status // "absent"' <<<"$jobs")"
            merge_conclusion="$(jq -r '[.jobs[] | select(.name=="merge")][0].conclusion // ""' <<<"$jobs")"
            comments="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100")"
            processed_tasks="$(jq -r '[.[].body | capture("SHARD_PROGRESS [0-9]+ (?<done>[0-9]+) [0-9]+")? | select(.) | (.done|tonumber)] | add // 0' <<<"$comments")"

            if [ "$merge_status" = "completed" ]; then
              if [ "$merge_conclusion" = "success" ] && [ "$failed_count" -eq 0 ]; then
                update_comment 100 "BİTTİ" "$done_count" "$running_count" "$failed_count" "$TOTAL_TASKS"
              elif [ "$failed_count" -gt 0 ]; then
                update_comment 100 "BİTTİ — GEÇERSİZ (${failed_count} shard hatalı)" "$done_count" "$running_count" "$failed_count" "$processed_tasks"
              else
                update_comment 100 "BİTTİ — sonuçta hata/kısmi veri var" "$done_count" "$running_count" "$failed_count" "$processed_tasks"
              fi
              break
            fi

            if [ "$done_count" -ge "$TOTAL_SHARDS" ]; then
              update_comment 95 "Sonuçlar birleştiriliyor" "$done_count" "$running_count" "$failed_count" "$processed_tasks"
            else
              pct=$(( processed_tasks * 95 / TOTAL_TASKS ))
              if [ "$pct" -gt 94 ]; then pct=94; fi
              update_comment "$pct" "Testler çalışıyor" "$done_count" "$running_count" "$failed_count" "$processed_tasks"
            fi
            sleep 15
          done
  cloud:
    cache-mode: write
    needs: prepare
    if: needs.prepare.outputs.backend == 'cloud' || needs.prepare.outputs.backend == 'hybrid'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.cloud_matrix) }}
    runs-on: ubuntu-latest
    env:
      PLAN_B64: ${{ needs.prepare.outputs.plan_b64 }}
      RESEARCH_BACKEND: cloud
      RESEARCH_OUT_DIR: artifacts/hybrid-research
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.prepare.outputs.total_shards }}
      GH_TOKEN: ${{ github.token }}
      PROGRESS_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout DataHub
        uses: actions/checkout@v4
        with:
          repository: ttaannsseell73-alt/Futures-Research-DataHub
          path: datahub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DataHub
        run: python -m pip install -e ./datahub

      - name: Restore persistent DataHub cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/datahub-cache
          key: datahub-v3-${{ runner.os }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            datahub-v3-${{ runner.os }}-shard-${{ matrix.shard }}-

      - name: Decode plan
        run: python -c "import os,base64;open('plan.json','wb').write(base64.b64decode(os.environ['PLAN_B64']))"

      - name: Run cloud shard
        env:
          DATAHUB_ROOT: ${{ runner.temp }}/datahub-cache
        run: node scripts/run-datahub-plan.mjs plan.json

      - name: Upload cloud result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datahub-cloud-result-${{ matrix.shard }}
          path: artifacts/hybrid-research/result-*.json
          if-no-files-found: error

  local:
    needs: prepare
    if: needs.prepare.outputs.backend == 'local' || needs.prepare.outputs.backend == 'hybrid'
    runs-on: [self-hosted, datahub-local]
    env:
      PLAN_B64: ${{ needs.prepare.outputs.plan_b64 }}
      DATAHUB_ROOT: ${{ vars.DATAHUB_LOCAL_ROOT || 'D:/Futures-Research-Data' }}
      RESEARCH_BACKEND: local
      RESEARCH_OUT_DIR: artifacts/hybrid-research
      SHARD_INDEX: ${{ needs.prepare.outputs.local_index }}
      SHARD_COUNT: ${{ needs.prepare.outputs.total_shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout DataHub
        uses: actions/checkout@v4
        with:
          repository: ttaannsseell73-alt/Futures-Research-DataHub
          path: datahub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DataHub
        run: python -m pip install -e ./datahub

      - name: Decode plan
        run: python -c "import os,base64;open('plan.json','wb').write(base64.b64decode(os.environ['PLAN_B64']))"

      - name: Run local shard
        run: node scripts/run-datahub-plan.mjs plan.json

      - name: Upload local result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datahub-local-result
          path: artifacts/hybrid-research/result-*.json
          if-no-files-found: error

  merge:
    needs: [prepare, cloud, local]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: datahub-*-result*
          path: artifacts/downloaded
          merge-multiple: false

      - name: Merge results
        run: node scripts/merge-datahub-results.mjs artifacts/downloaded artifacts/hybrid-research/combined.json

      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: datahub-research-result
          path: artifacts/hybrid-research/combined.json
          if-no-files-found: error
