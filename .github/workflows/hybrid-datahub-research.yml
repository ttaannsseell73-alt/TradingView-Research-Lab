name: Hybrid DataHub Research

on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: JSON research plan
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.author_association == 'OWNER' &&
       startsWith(github.event.issue.title, '[DATAHUB JOB]'))
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      plan_b64: ${{ steps.plan.outputs.plan_b64 }}
    steps:
      - name: Validate and encode plan
        id: plan
        env:
          DISPATCH_PLAN: ${{ inputs.plan_json }}
          ISSUE_PLAN: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          raw = (os.environ.get("DISPATCH_PLAN") or os.environ.get("ISSUE_PLAN") or "").strip()
          plan = json.loads(raw)
          backend = plan.get("backend")
          if backend not in {"cloud", "local", "hybrid"}:
              raise SystemExit("backend must be cloud|local|hybrid")
          encoded = base64.b64encode(raw.encode()).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"backend={backend}\n")
              fh.write(f"plan_b64={encoded}\n")
          PY

  cloud:
    needs: prepare
    if: needs.prepare.outputs.backend == 'cloud' || needs.prepare.outputs.backend == 'hybrid'
    runs-on: ubuntu-latest
    env:
      PLAN_B64: ${{ needs.prepare.outputs.plan_b64 }}
      DATAHUB_ROOT: ${{ runner.temp }}/datahub-cache
      RESEARCH_BACKEND: cloud
      RESEARCH_OUT_DIR: artifacts/hybrid-research
      SHARD_COUNT: ${{ needs.prepare.outputs.backend == 'hybrid' && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout DataHub
        uses: actions/checkout@v4
        with:
          repository: ttaannsseell73-alt/Futures-Research-DataHub
          path: datahub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore cloud DataHub cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/datahub-cache
          key: datahub-cloud-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            datahub-cloud-${{ runner.os }}-

      - name: Install DataHub
        run: python -m pip install -e ./datahub

      - name: Decode plan
        run: python -c "import os,base64;open('plan.json','wb').write(base64.b64decode(os.environ['PLAN_B64']))"

      - name: Run cloud shard
        run: node scripts/run-datahub-plan.mjs plan.json

      - name: Upload cloud result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datahub-cloud-result
          path: artifacts/hybrid-research/result-*.json
          if-no-files-found: error

  local:
    needs: prepare
    if: needs.prepare.outputs.backend == 'local' || needs.prepare.outputs.backend == 'hybrid'
    runs-on: [self-hosted, datahub-local]
    env:
      PLAN_B64: ${{ needs.prepare.outputs.plan_b64 }}
      DATAHUB_ROOT: ${{ vars.DATAHUB_LOCAL_ROOT || 'D:/Futures-Research-Data' }}
      RESEARCH_BACKEND: local
      RESEARCH_OUT_DIR: artifacts/hybrid-research
      SHARD_INDEX: ${{ needs.prepare.outputs.backend == 'hybrid' && '1' || '0' }}
      SHARD_COUNT: ${{ needs.prepare.outputs.backend == 'hybrid' && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout DataHub
        uses: actions/checkout@v4
        with:
          repository: ttaannsseell73-alt/Futures-Research-DataHub
          path: datahub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DataHub
        run: python -m pip install -e ./datahub

      - name: Decode plan
        run: python -c "import os,base64;open('plan.json','wb').write(base64.b64decode(os.environ['PLAN_B64']))"

      - name: Run local shard
        run: node scripts/run-datahub-plan.mjs plan.json

      - name: Upload local result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datahub-local-result
          path: artifacts/hybrid-research/result-*.json
          if-no-files-found: error

  merge:
    needs: [prepare, cloud, local]
    if: always() && needs.prepare.result == 'success' && (needs.cloud.result == 'success' || needs.local.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: datahub-*-result
          path: artifacts/downloaded
          merge-multiple: false

      - name: Merge results
        run: node scripts/merge-datahub-results.mjs artifacts/downloaded artifacts/hybrid-research/combined.json

      - name: Upload combined result
        uses: actions/upload-artifact@v4
        with:
          name: datahub-research-result
          path: artifacts/hybrid-research/combined.json
          if-no-files-found: error
