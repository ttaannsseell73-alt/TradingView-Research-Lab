name: Range48 1Y 15m Cloud

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  prepare:
    if: ${{ github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[RANGE48 1Y 15M CLOUD]') }}
    runs-on: ubuntu-latest
    outputs:
      plan_b64: ${{ steps.plan.outputs.plan_b64 }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Validate cloud plan
        id: plan
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os
          raw=(os.environ.get("ISSUE_BODY") or "").strip()
          plan=json.loads(raw)
          symbols=sorted(set(plan.get("symbols") or []))
          if not symbols:
              raise SystemExit("symbols required")
          if plan.get("timeframes") != ["15m"]:
              raise SystemExit("timeframes must be exactly [15m]")
          if plan.get("strategies") != ["swp_range48_reclaim"]:
              raise SystemExit("strategy must be swp_range48_reclaim")
          shards=int(plan.get("cloudShards",8))
          if not 1 <= shards <= 8:
              raise SystemExit("cloudShards must be 1..8")
          plan["backend"]="cloud"
          plan["symbols"]=symbols
          encoded=base64.b64encode(json.dumps(plan,separators=(",",":")).encode()).decode()
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("plan_b64="+encoded+"\n")
              f.write("matrix="+json.dumps(list(range(shards)),separators=(",",":"))+"\n")
              f.write("shard_count="+str(shards)+"\n")
          PY

  cloud:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PLAN_B64: ${{ needs.prepare.outputs.plan_b64 }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
      RESEARCH_BACKEND: cloud
      RESEARCH_OUT_DIR: artifacts/range48-cloud
      DATAHUB_ROOT: ${{ runner.temp }}/datahub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ttaannsseell73-alt/Futures-Research-DataHub
          path: datahub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DataHub
        run: python -m pip install --disable-pip-version-check -e ./datahub

      - name: Decode plan
        run: python -c "import os,base64;open('range48-cloud-plan.json','wb').write(base64.b64decode(os.environ['PLAN_B64']))"

      - name: Run cloud shard
        run: node scripts/run-datahub-plan.mjs range48-cloud-plan.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: range48-cloud-shard-${{ matrix.shard }}
          path: artifacts/range48-cloud/result-cloud-*.json
          if-no-files-found: warn
          compression-level: 6

  merge:
    needs:
      - prepare
      - cloud
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: range48-cloud-shard-*
          path: artifacts/range48-cloud-merged
          merge-multiple: true

      - name: Merge and summarize
        run: node scripts/summarize-range48-cloud.mjs artifacts/range48-cloud-merged

      - name: Upload merged result
        uses: actions/upload-artifact@v4
        with:
          name: range48-1y-15m-cloud-result
          path: |
            artifacts/range48-cloud-merged/result-cloud-*.json
            artifacts/range48-cloud-merged/range48-cloud-top-12m.csv
            artifacts/range48-cloud-merged/range48-cloud-summary.json
          if-no-files-found: error
          compression-level: 6
