name: Range48 1Y 15m Cloud

on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: "Range48 cloud plan JSON"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  cloud:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PLAN_JSON: ${{ inputs.plan_json }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: 8
      RESEARCH_BACKEND: cloud
      RESEARCH_OUT_DIR: artifacts/range48-cloud
      DATAHUB_ROOT: ${{ runner.temp }}/datahub-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ttaannsseell73-alt/Futures-Research-DataHub
          path: datahub

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DataHub
        run: python -m pip install --disable-pip-version-check -e ./datahub

      - name: Validate and write plan
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          plan = json.loads(os.environ["PLAN_JSON"])
          symbols = sorted(set(plan.get("symbols") or []))
          if not symbols:
              raise SystemExit("symbols required")
          if plan.get("timeframes") != ["15m"]:
              raise SystemExit("timeframes must be exactly [15m]")
          if plan.get("strategies") != ["swp_range48_reclaim"]:
              raise SystemExit("strategy must be swp_range48_reclaim")
          plan["backend"] = "cloud"
          plan["symbols"] = symbols
          Path("range48-cloud-plan.json").write_text(
              json.dumps(plan, separators=(",", ":")),
              encoding="utf-8",
          )

      - name: Run cloud shard
        run: node scripts/run-datahub-plan.mjs range48-cloud-plan.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: range48-cloud-shard-${{ matrix.shard }}
          path: artifacts/range48-cloud/result-cloud-*.json
          if-no-files-found: warn
          compression-level: 6

  merge:
    needs: cloud
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: range48-cloud-shard-*
          path: artifacts/range48-cloud-merged
          merge-multiple: true

      - name: Merge and summarize
        run: node scripts/summarize-range48-cloud.mjs artifacts/range48-cloud-merged

      - name: Upload merged result
        uses: actions/upload-artifact@v4
        with:
          name: range48-1y-15m-cloud-result
          path: |
            artifacts/range48-cloud-merged/result-cloud-*.json
            artifacts/range48-cloud-merged/range48-cloud-top-12m.csv
            artifacts/range48-cloud-merged/range48-cloud-summary.json
          if-no-files-found: error
          compression-level: 6
