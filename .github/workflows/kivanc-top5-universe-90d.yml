name: strategy-selector-universe-90d

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fetch-kivanc-vision-shard.py'
      - 'scripts/run-kivanc-offline-shard.mjs'
      - 'scripts/combine-kivanc-shards.mjs'
      - 'research/kivanc_symbols_2026-09-24.json'
      - 'research/strategy_engine_v2.mjs'
      - 'scripts/build-opportunity-board.mjs'
      - 'scripts/build-cross-timeframe-board.mjs'
      - '.github/workflows/kivanc-top5-universe-90d.yml'

permissions:
  contents: read

jobs:
