            shards: 24
          - timeframe: 5m
            shard: 23
            shards: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          python -m py_compile scripts/fetch-kivanc-vision-shard.py
          node --check scripts/run-kivanc-offline-shard.mjs
          node --check scripts/combine-kivanc-shards.mjs
          node --check scripts/build-opportunity-board.mjs
          node --check scripts/build-cross-timeframe-board.mjs
          node --check research/strategy_engine_v2.mjs
      - name: Download Binance Vision candles with warmup
        run: |
          python scripts/fetch-kivanc-vision-shard.py \
            --shard ${{ matrix.shard }} \
            --shards ${{ matrix.shards }} \
            --timeframe ${{ matrix.timeframe }} \
            --warmup-bars 200 \
            --out .tmp/strategy-${{ matrix.timeframe }}-${{ matrix.shard }}
      - name: Evaluate strategy catalog
        run: |
          node scripts/run-kivanc-offline-shard.mjs \
            ${{ matrix.shard }} \
            .tmp/strategy-${{ matrix.timeframe }}-${{ matrix.shard }} \
            artifacts/strategy-shards/results-shard-${{ matrix.shard }}.json \
            ${{ matrix.timeframe }}
      - name: Upload shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: strategy-shard-${{ matrix.timeframe }}-${{ matrix.shard }}
          path: artifacts/strategy-shards/results-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        timeframe: [1h, 4h, 1d, 5m]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: strategy-shard-${{ matrix.timeframe }}-*
          path: artifacts/strategy-shards
          merge-multiple: true
      - name: Combine strategy results
        run: |
          node scripts/combine-kivanc-shards.mjs \
            artifacts/strategy-shards \
            artifacts/strategy-final \
            ${{ matrix.timeframe }}
      - name: Build profitability-first opportunity board
        run: |
          TF_UP=$(echo "${{ matrix.timeframe }}" | tr '[:lower:]' '[:upper:]')
          node scripts/build-opportunity-board.mjs \
            "artifacts/strategy-final/STRATEGY_SELECTOR_90D_${TF_UP}.json" \
            artifacts/opportunity-board
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-selector-universe-90d-${{ matrix.timeframe }}-final
          path: |
            artifacts/strategy-final/
            artifacts/opportunity-board/
          if-no-files-found: error
          retention-days: 30


  cross-timeframe:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: strategy-selector-universe-90d-*-final
          path: artifacts/all-timeframes
      - name: Build cross-timeframe management board
        run: |
          node scripts/build-cross-timeframe-board.mjs \
            artifacts/all-timeframes \
            artifacts/cross-timeframe
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-selector-cross-timeframe-final
          path: artifacts/cross-timeframe/
          if-no-files-found: error
          retention-days: 30
