name: Local Data Inventory

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inventory:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[LOCAL DATA INVENTORY]')
    runs-on: [self-hosted, datahub-local]
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Inventory local market-data stores
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "C:\Futures-Research-Data",
            "C:\Users\TANSEL\Desktop\SCALPING_LAB\freqtrade\user_data\data\binance\futures"
          )

          $out = New-Object System.Collections.Generic.List[string]
          $out.Add("LOCAL DATA INVENTORY")
          $out.Add("Runner: " + $env:COMPUTERNAME)
          $out.Add("")

          foreach ($p in $paths) {
            $out.Add("PATH: " + $p)

            if (-not (Test-Path -LiteralPath $p)) {
              $out.Add("EXISTS: NO")
              $out.Add("")
              continue
            }

            $files = @(Get-ChildItem -LiteralPath $p -File -Recurse -ErrorAction SilentlyContinue)
            $count = $files.Count
            $sum = ($files | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $sum) { $sum = 0 }
            $gb = [math]::Round(($sum / 1GB), 3)

            $out.Add("EXISTS: YES")
            $out.Add("FILES: " + $count)
            $out.Add("SIZE_GB: " + $gb)

            $latest = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latest) {
              $out.Add("LATEST_FILE: " + $latest.FullName)
              $out.Add("LATEST_MODIFIED: " + $latest.LastWriteTime.ToString("s"))
            }

            $groups = $files | Group-Object Extension | Sort-Object Count -Descending | Select-Object -First 10
            foreach ($g in $groups) {
              $out.Add("EXT " + $g.Name + ": " + $g.Count)
            }

            foreach ($tf in @("1m","5m","15m","1h","4h")) {
              $pattern = "(?i)(^|[-_.])" + [regex]::Escape($tf) + "([-_.]|$)"
              $tfCount = @($files | Where-Object { $_.Name -match $pattern }).Count
              $out.Add("TF " + $tf + ": " + $tfCount)
            }

            $out.Add("SAMPLES:")
            foreach ($s in ($files | Select-Object -First 8)) {
              $out.Add($s.FullName)
            }

            $out.Add("")
          }

          $tmp = Join-Path $env:RUNNER_TEMP "local-data-inventory.txt"
          $out | Set-Content -LiteralPath $tmp -Encoding UTF8
          Get-Content -LiteralPath $tmp
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPO --body-file $tmp
