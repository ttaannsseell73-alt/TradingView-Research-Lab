name: Local Data Inventory

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inventory:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[LOCAL DATA INVENTORY]')
    runs-on: [self-hosted, datahub-local]
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Inventory local market-data stores
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "C:\Futures-Research-Data",
            "C:\Users\TANSEL\Desktop\SCALPING_LAB\freqtrade\user_data\data\binance\futures"
          )

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("<!-- LOCAL_DATA_INVENTORY -->")
          $lines.Add("## Local market-data inventory")
          $lines.Add("")
          $lines.Add("Generated on runner: `$env:COMPUTERNAME`")
          $lines.Add("")

          foreach ($p in $paths) {
            $lines.Add("### `$p`")
            if (-not (Test-Path $p)) {
              $lines.Add("- exists: **NO**")
              $lines.Add("")
              continue
            }

            $files = @(Get-ChildItem -Path $p -File -Recurse -ErrorAction SilentlyContinue)
            $count = $files.Count
            $bytes = ($files | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $bytes) { $bytes = 0 }
            $gb = [math]::Round($bytes / 1GB, 3)
            $latest = ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1)

            $lines.Add("- exists: **YES**")
            $lines.Add("- files: **$count**")
            $lines.Add("- size: **$gb GB**")
            if ($latest) {
              $lines.Add("- latest file: `$($latest.FullName)`")
              $lines.Add("- latest modified: **$($latest.LastWriteTime.ToString("s"))**")
            }

            $extGroups = $files |
              Group-Object Extension |
              Sort-Object Count -Descending |
              Select-Object -First 10
            if ($extGroups) {
              $extText = ($extGroups | ForEach-Object { "`$($_.Name)`=$($_.Count)" }) -join ", "
              $lines.Add("- extensions: $extText")
            }

            foreach ($tf in @("1m","5m","15m","1h","4h")) {
              $tfCount = @($files | Where-Object {
                $_.Name -match "(?i)(^|[-_.])$([regex]::Escape($tf))([-_.]|$)"
              }).Count
              $lines.Add("- timeframe filename hits `$tf`: **$tfCount**")
            }

            $samples = $files | Select-Object -First 8
            if ($samples) {
              $lines.Add("- sample files:")
              foreach ($s in $samples) {
                $lines.Add("  - `$($s.FullName)`")
              }
            }
            $lines.Add("")
          }

          $body = $lines -join [Environment]::NewLine
          $tmp = Join-Path $env:RUNNER_TEMP "local-data-inventory.md"
          Set-Content -Path $tmp -Value $body -Encoding UTF8
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPO --body-file $tmp
