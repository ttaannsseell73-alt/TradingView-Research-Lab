name: STR100 Runtime Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[STR100 PROBE]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FREQTRADE_FUTURES_ROOT: ${{ github.workspace }}/.probe-data
      DATAHUB_PYTHON: python3
      EXACT_KEY: 027-crypto-institutional-liquidity-sweep-strategy
      EXACT_NAME: Crypto Institutional Liquidity Sweep Strategy
      EXACT_AUTHOR: Danish7421
      EXACT_ORIGIN: sweep_exact_research
      EXACT_GROUP: sweep_exact
      EXACT_SCRIPT_ID: PUB;61910d0a54484ce7b9aa5dcd8f9912fe
      EXACT_SOURCE_SHA256: 20247debd352052e0896cd265a2d9485e35c60071a1f148f033a6a7e82668b3c
      EXACT_PINE_VERSION: '5'
      EXACT_URL: https://www.tradingview.com/script/ZhJzjmAk-Crypto-Institutional-Liquidity-Sweep-Strategy/
      EXACT_START: 2025-09-28T00:00:00Z
      EXACT_END: 2026-09-28T00:00:00Z
      EXACT_CSV_CACHE: ${{ github.workspace }}/.probe-cache
      EXACT_OUT_DIR: artifacts/str100-runtime-probe
      EXACT_SMOKE_BARS: '600'
      EXACT_PREFLIGHT_ONLY: '1'
      TURBO_STRICT_CACHE: '1'
      LOCAL_PARALLEL_SHARDS: '1'
      PINE_SOURCE_CACHE: ${{ github.workspace }}/.probe-source-cache

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned PineTS
        run: npm install --no-save --package-lock=false --audit=false --fund=false pinets@0.10.0

      - name: Build 600-bar BTCUSDT 15m probe cache
        shell: python
        run: |
          import csv, json, pathlib, urllib.request
          cache=pathlib.Path(".probe-cache")
          data=pathlib.Path(".probe-data")
          cache.mkdir(parents=True, exist_ok=True)
          data.mkdir(parents=True, exist_ok=True)
          url="https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=600"
          req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          rows=json.load(urllib.request.urlopen(req, timeout=30))
          with (cache/"BTCUSDT-15m.csv").open("w", newline="", encoding="utf-8") as f:
              w=csv.writer(f)
              w.writerow(["openTime","open","high","low","close","volume"])
              for r in rows:
                  w.writerow([r[0],r[1],r[2],r[3],r[4],r[5]])

      - name: Probe previous syminfo failure
        shell: bash
        run: |
          export TURBO_PINETS_MODE=exact
          node scripts/run-pinets-turbo-local.mjs
          cat "$EXACT_OUT_DIR/preflight.json"

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: str100-runtime-probe
          path: artifacts/str100-runtime-probe/
          if-no-files-found: error
          retention-days: 7
