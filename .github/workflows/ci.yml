name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Validate Strategy Selector live pipeline
        run: |
          python -m py_compile scripts/fetch-live-market-snapshot.py
          python -m py_compile scripts/fetch-current-candles.py
          node --check scripts/build-cross-timeframe-board.mjs
          node --check scripts/build-execution-watchlist.mjs
          node --check scripts/build-current-signal-watchlist.mjs
          node --check scripts/build-shadow-journal.mjs
          node --check research/strategy_engine_v2.mjs
          node --check research/sweep_strategies.mjs
          node --check research/visual_strategies.mjs
          node --check scripts/select-recovery-variant.mjs
          node --check scripts/run-pinets-recovered-strategy.mjs
          node --check scripts/run-pinets-exact-strategy.mjs
          node --check scripts/run-pinets-turbo-local.mjs
          node --check scripts/build-turbo-cache-plan.mjs
          node --check scripts/run-datahub-plan-parallel-local.mjs
          node scripts/assert-turbo-workflows.mjs
          python -m py_compile scripts/build-recovery-matrix.py scripts/build-recovery-variants.py scripts/export-freqtrade-feather-batch.py
